<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSTRP - Monochrome 3D Space</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            overflow: hidden;
            font-family: 'Space Grotesk', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
        }

        /* Starfield Background */
        .stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #111 0%, #000 100%);
            z-index: -2;
        }

        .star {
            position: absolute;
            background: #ffffff;
            border-radius: 50%;
            opacity: var(--opacity);
            animation: twinkle var(--duration) infinite ease-in-out;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); box-shadow: 0 0 10px rgba(255, 255, 255, 0.8); }
        }

        /* Subtle Ambient Nebula Glow */
        .nebula {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.05) 0%, rgba(100, 100, 100, 0.02) 40%, transparent 70%);
            border-radius: 50%;
            filter: blur(60px);
            z-index: -1;
            animation: pulseNebula 8s infinite alternate ease-in-out;
        }

        @keyframes pulseNebula {
            0% { transform: scale(0.9); opacity: 0.4; }
            100% { transform: scale(1.3); opacity: 0.8; }
        }

        /* 3D Scene Container */
        .scene {
            position: relative;
            transform-style: preserve-3d;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* JSTRP Link Container */
        .logo-link {
            text-decoration: none;
            transform-style: preserve-3d;
            display: inline-block;
            cursor: pointer;
            transition: transform 0.1s ease-out;
        }

        /* 3D Multi-Layer Monochrome Text */
        .jstrp-3d {
            font-size: clamp(5rem, 16vw, 13rem);
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: #ffffff;
            transform-style: preserve-3d;
            position: relative;
            user-select: none;
            /* Deep stacked monochrome shadows for real 3D extrusion */
            text-shadow: 
                0 1px 0 #cccccc,
                0 2px 0 #b3b3b3,
                0 3px 0 #999999,
                0 4px 0 #808080,
                0 5px 0 #666666,
                0 6px 0 #4d4d4d,
                0 7px 0 #333333,
                0 8px 0 #1a1a1a,
                0 15px 30px rgba(255, 255, 255, 0.2),
                0 0 50px rgba(255, 255, 255, 0.4);
            transition: text-shadow 0.3s ease, color 0.3s ease;
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(-10px) rotateX(4deg) rotateY(-8deg); }
            50% { transform: translateY(10px) rotateX(-4deg) rotateY(8deg); }
        }

        /* Hover effect: Intense white glow and chrome feel */
        .logo-link:hover .jstrp-3d {
            color: #ffffff;
            text-shadow: 
                0 1px 0 #e6e6e6,
                0 2px 0 #cccccc,
                0 3px 0 #b3b3b3,
                0 4px 0 #999999,
                0 5px 0 #808080,
                0 0 20px rgba(255, 255, 255, 0.9),
                0 0 50px rgba(255, 255, 255, 0.8),
                0 0 100px rgba(255, 255, 255, 0.6);
        }

        /* Subtle floating dust particles */
        .dust {
            position: absolute;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            pointer-events: none;
            animation: riseDust linear infinite;
        }

        @keyframes riseDust {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="stars" id="stars"></div>
    <div class="nebula"></div>

    <div class="scene" id="scene">
        <a href="https://kazukigs.github.io/JBC/juice-milk.html" class="logo-link" id="logoLink" target="_blank" title="คลิกเพื่อไปที่ Google">
            <h1 class="jstrp-3d" id="logoText">JSTRP</h1>
        </a>
    </div>

    <script>
        // Generate Starfield
        const starsContainer = document.getElementById('stars');
        for (let i = 0; i < 150; i++) {
            const star = document.createElement('div');
            star.classList.add('star');
            const size = Math.random() * 2.5 + 0.5;
            star.style.width = `${size}px`;
            star.style.height = `${size}px`;
            star.style.top = `${Math.random() * 100}%`;
            star.style.left = `${Math.random() * 100}%`;
            star.style.setProperty('--duration', `${Math.random() * 3 + 2}s`);
            star.style.setProperty('--opacity', Math.random() * 0.7 + 0.3);
            star.style.animationDelay = `${Math.random() * 5}s`;
            starsContainer.appendChild(star);
        }

        // Generate ambient space dust
        for (let i = 0; i < 30; i++) {
            const dust = document.createElement('div');
            dust.classList.add('dust');
            const size = Math.random() * 3 + 1;
            dust.style.width = `${size}px`;
            dust.style.height = `${size}px`;
            dust.style.left = `${Math.random() * 100}%`;
            dust.style.animationDuration = `${Math.random() * 8 + 6}s`;
            dust.style.animationDelay = `${Math.random() * 5}s`;
            document.body.appendChild(dust);
        }

        // Interactive 3D Mouse Parallax Tilt for JSTRP text
        const logoLink = document.getElementById('logoLink');
        
        document.addEventListener('mousemove', (e) => {
            const xAxis = (window.innerWidth / 2 - e.pageX) / 18;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 18;
            logoLink.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        });

        document.addEventListener('mouseleave', () => {
            logoLink.style.transform = `rotateY(0deg) rotateX(0deg)`;
            logoLink.style.transition = `transform 0.5s ease`;
        });

        logoLink.addEventListener('mouseenter', () => {
            logoLink.style.transition = `none`;
        });
    </script>
</body>
</html>
