<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>วันนี้อนิเมะอะไรอัพ — On Air Guide</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap');

  :root{
    --bg: #0a0a0c;
    --panel: #151517;
    --panel-hi: #1d1d21;
    --line: #2a2a2f;
    --paper: #f5f2ea;
    --muted: #8a8a92;
    --signal: #e8482c;   /* broadcast red — live/on-air */
    --signal-dim: #5c2018;
    --teal: #3d9a82;     /* upcoming / time data */
    --gold: #d9a441;     /* episode tag */
    --page-max: 560px;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html{ scroll-behavior:smooth; }
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(1200px 500px at 50% -15%, rgba(232,72,44,0.07), transparent 60%),
      var(--bg);
    color:var(--paper);
    font-family:'Inter', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  .mono{ font-family:'JetBrains Mono', monospace; }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; scroll-behavior:auto !important; }
  }

  header, main { max-width: var(--page-max); margin: 0 auto; transition: max-width .25s ease; }

  /* ── HEADER ── broadcast channel ident ── */
  header{
    padding: 28px 20px 20px;
    border-bottom: 1px solid var(--line);
    position: relative;
  }
  .channel-row{
    display:flex; justify-content:space-between; align-items:flex-start; gap:16px;
  }
  .ident-mark{
    display:flex; align-items:center; gap:8px; margin-bottom:10px;
  }
  .ident-dot{
    width:8px; height:8px; border-radius:50%;
    background: var(--signal);
    box-shadow: 0 0 0 3px var(--signal-dim);
    animation: livepulse 1.6s ease-in-out infinite;
  }
  @keyframes livepulse{
    0%,100%{ opacity:1; transform:scale(1); }
    50%{ opacity:0.5; transform:scale(0.85); }
  }
  .ident-label{
    font-family:'JetBrains Mono', monospace;
    font-size:10px; letter-spacing:0.22em; text-transform:uppercase; color:var(--signal);
    font-weight:700;
  }
  h1{
    margin:0;
    font-family:'Archivo Black', sans-serif;
    font-size: 26px;
    line-height:1.05;
    letter-spacing:-0.01em;
    color:var(--paper);
    background: linear-gradient(100deg, var(--paper) 40%, var(--teal) 60%, var(--paper) 80%);
    background-size: 240% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    animation: sheen 7s ease-in-out infinite;
  }
  @keyframes sheen{
    0%,100%{ background-position: 0% 0; }
    50%{ background-position: 100% 0; }
  }
  .sub{ color:var(--muted); font-size:12.5px; margin-top:6px; }
  .clock-block{ text-align:right; flex-shrink:0; }
  .clock-block .clock{
    font-family:'JetBrains Mono', monospace; font-size:20px; font-weight:700; color:var(--paper);
    letter-spacing:-0.02em;
    font-variant-numeric: tabular-nums;
  }
  .clock-block .tz{ font-size:10px; color:var(--muted); font-family:'JetBrains Mono', monospace; margin-top:2px; }

  main{ padding: 20px 20px 60px; }

  /* ── MODE TABS ── */
  .tabs{ display:flex; gap:6px; margin-bottom:14px; }
  .tab{
    flex:1;
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--muted);
    padding:9px 14px;
    border-radius:8px;
    font-size:12.5px;
    font-weight:700;
    cursor:pointer;
    text-align:center;
    transition: all .15s ease;
    font-family:'Inter', sans-serif;
  }
  .tab.active{ background:var(--signal); border-color:var(--signal); color:#fff; box-shadow: 0 4px 16px -4px rgba(232,72,44,0.55); }
  .tab:not(.active):hover{ border-color:#3a3a42; color:var(--paper); transform: translateY(-1px); }
  .tab:active{ transform: scale(0.97); }

  /* ── DAY NAV (pagination) ── */
  .day-nav{
    display:flex; gap:6px; margin-bottom:18px;
    overflow-x:auto; padding-bottom:2px; scrollbar-width:none;
  }
  .day-nav::-webkit-scrollbar{ display:none; }
  .day-btn{
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--muted);
    padding:7px 10px;
    border-radius:8px;
    font-family:'JetBrains Mono', monospace;
    font-size:11.5px;
    font-weight:600;
    cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:1px;
    min-width:46px;
    transition: all .15s ease;
  }
  .day-btn .d-name{ font-size:9.5px; opacity:0.75; letter-spacing:0.05em; }
  .day-btn .d-num{ font-size:14px; font-weight:700; }
  .day-btn.active{
    background: rgba(232,72,44,0.12);
    border-color: var(--signal);
    color: var(--paper);
  }
  .day-btn.active .d-name{ color: var(--signal); opacity:1; }
  .day-btn:not(.active):hover{ border-color:#3a3a42; color:var(--paper); transform: translateY(-1px); }

  /* ── STATUS ROW ── */
  .refresh-row{
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom:16px; gap:12px;
  }
  .status{ font-size:11px; color:var(--muted); font-family:'JetBrains Mono', monospace; }
  .status b{ color:var(--teal); }
  button.refresh{
    background:transparent; border:1px solid var(--line); color:var(--paper);
    padding:7px 14px; border-radius:999px; font-size:12px; font-weight:600;
    cursor:pointer; display:flex; align-items:center; gap:6px;
    font-family:'Inter', sans-serif; transition: all .15s ease;
  }
  button.refresh:hover{ border-color:var(--signal); color:var(--signal); transform: translateY(-1px); }
  button.refresh:active{ transform: scale(0.96); }
  button.refresh:disabled{ opacity:0.5; cursor:default; }
  .spin{ display:inline-block; animation: spin 0.8s linear infinite; }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  #schedule-container{
    display:flex; flex-direction:column; gap:1px;
    background:var(--line); border-radius:12px; overflow:hidden; border:1px solid var(--line);
    transition: all .25s ease;
  }

  /* ── SCHEDULE ROW ── styled like a broadcast guide line ── */
  .card{
    background:var(--panel);
    display:flex; flex-direction:row; align-items:stretch;
    text-decoration:none; color:var(--paper);
    transition: background .15s ease, transform .18s ease;
    position: relative;
    cursor: pointer;
    opacity: 0;
    animation: cardIn .5s ease forwards;
  }
  @keyframes cardIn{
    from{ opacity:0; transform: translateY(8px); }
    to{ opacity:1; transform: translateY(0); }
  }
  .card:hover{ background:var(--panel-hi); }
  .card:active{ transform: scale(0.99); }

  .time-col{
    width:64px; flex-shrink:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding: 10px 6px;
    border-right: 1px solid var(--line);
    gap:4px;
  }
  .time-col .t{
    font-family:'JetBrains Mono', monospace; font-size:13px; font-weight:700; color:var(--paper);
  }
  .time-col .countdown{
    font-family:'JetBrains Mono', monospace; font-size:9px; color:var(--muted);
    text-align:center; line-height:1.3;
  }
  .time-col .countdown.live{ color:var(--signal); font-weight:700; }
  .time-col .countdown.live .lv-dot{
    display:inline-block; width:5px; height:5px; border-radius:50%; background:var(--signal);
    margin-right:3px; animation: livepulse 1.4s ease-in-out infinite;
  }

  .poster{
    width: 54px; height: 76px; margin: 8px 0 8px 10px;
    border-radius: 5px; object-fit:cover; background: var(--panel-hi); flex-shrink: 0;
    transition: transform .25s ease;
  }
  .card:hover .poster{ transform: scale(1.04); }

  .body{
    display:flex; flex-direction:column; justify-content:center; gap:3px;
    flex:1; min-width:0; padding: 8px 12px;
  }
  .title-en{
    font-weight:700; font-size:13.5px; line-height:1.3; color:var(--paper);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .title-native{
    font-size:11.5px; color: var(--teal); line-height:1.3;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    font-weight:500;
  }
  .meta{ display:flex; align-items:center; gap:8px; margin-top:3px; }
  .ep{
    font-family:'JetBrains Mono', monospace; font-size:10px; font-weight:700; color:#1a1408;
    background: var(--gold);
    padding:2px 7px; border-radius:4px; letter-spacing:0.02em;
  }
  .fmt{ font-size:10px; color:var(--muted); font-family:'JetBrains Mono', monospace; }

  .empty, .loading, .error{
    text-align:center; padding: 48px 20px; color:var(--muted);
    font-family:'JetBrains Mono', monospace; font-size:12px;
    background: var(--panel); border-radius:12px;
  }
  .error{ color: var(--signal); }
  .loading .dot{ animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{opacity:0.3;} 50%{opacity:1;} }

  /* skeleton shimmer while loading */
  .skeleton-wrap{ display:flex; flex-direction:column; gap:1px; background:var(--line); border-radius:12px; overflow:hidden; border:1px solid var(--line); }
  .skeleton-row{ background:var(--panel); display:flex; gap:10px; padding:10px 12px; align-items:center; }
  .skel{ background: linear-gradient(100deg, var(--panel-hi) 30%, #262629 50%, var(--panel-hi) 70%); background-size: 200% 100%; animation: shimmer 1.3s ease-in-out infinite; border-radius:5px; }
  @keyframes shimmer{ 0%{ background-position: 150% 0; } 100%{ background-position: -50% 0; } }
  .skel-poster{ width:54px; height:76px; flex-shrink:0; }
  .skel-lines{ flex:1; display:flex; flex-direction:column; gap:8px; }
  .skel-line{ height:10px; border-radius:4px; }

  /* group divider for day-grouped week view */
  .day-heading{
    font-family:'JetBrains Mono', monospace;
    font-size:10.5px; letter-spacing:0.15em; text-transform:uppercase;
    color:var(--muted); padding: 16px 4px 8px; background:var(--bg);
  }
  .day-heading:first-child{ padding-top:0; }

  footer{
    text-align:center; color:#3a3a42; font-family:'JetBrains Mono', monospace;
    font-size:11px; padding:24px 20px; max-width: var(--page-max); margin:0 auto;
  }
  footer a{ color: var(--teal); text-decoration:none; }
  footer a:hover{ text-decoration:underline; }

  /* ═══════════════════ PREVIEW DRAWER (broadcast monitor) ═══════════════════ */
  .preview-overlay{
    position: fixed; inset:0; z-index: 100;
    pointer-events: none;
    visibility: hidden;
  }
  .preview-overlay.open{ pointer-events:auto; visibility:visible; }
  .preview-backdrop{
    position:absolute; inset:0;
    background: rgba(6,6,7,0.6);
    backdrop-filter: blur(3px);
    opacity:0; transition: opacity .25s ease;
  }
  .preview-overlay.open .preview-backdrop{ opacity:1; }

  .preview-panel{
    position:absolute;
    left:0; right:0; bottom:0;
    max-height: 86vh;
    background: var(--panel);
    border-top: 1px solid var(--line);
    border-radius: 18px 18px 0 0;
    transform: translateY(100%);
    transition: transform .35s cubic-bezier(.22,.9,.34,1);
    overflow: hidden;
    display:flex; flex-direction:column;
    box-shadow: 0 -20px 60px -20px rgba(0,0,0,0.6);
  }
  .preview-overlay.open .preview-panel{ transform: translateY(0); }
  .preview-panel::before{
    content:''; position:absolute; top:8px; left:50%; transform:translateX(-50%);
    width:36px; height:4px; border-radius:99px; background: var(--line); z-index:3;
  }

  .preview-scroll{ overflow-y:auto; overscroll-behavior:contain; }

  .preview-close{
    position:absolute; top:14px; right:14px; z-index:5;
    width:30px; height:30px; border-radius:50%;
    background: rgba(10,10,12,0.55); border:1px solid var(--line); color:var(--paper);
    font-size:14px; cursor:pointer; display:flex; align-items:center; justify-content:center;
    backdrop-filter: blur(4px);
    transition: all .15s ease;
  }
  .preview-close:hover{ background: var(--signal); border-color: var(--signal); transform: rotate(90deg); }

  .preview-banner{
    height: 150px; width:100%;
    background-size: cover; background-position: center;
    position: relative;
    flex-shrink:0;
  }
  .preview-banner::after{
    content:''; position:absolute; inset:0;
    background: linear-gradient(180deg, rgba(10,10,12,0.1) 40%, var(--panel) 100%);
  }
  /* scanline flourish — on-brand broadcast monitor texture */
  .preview-banner::before{
    content:''; position:absolute; inset:0; z-index:2;
    background: repeating-linear-gradient(180deg, rgba(0,0,0,0.15) 0px, rgba(0,0,0,0.15) 1px, transparent 1px, transparent 3px);
    mix-blend-mode: overlay; opacity:.5;
  }

  .preview-head{
    display:flex; gap:14px; padding: 0 20px; margin-top:-42px; position:relative; z-index:3;
  }
  .preview-poster{
    width:88px; height:126px; border-radius:8px; object-fit:cover;
    border:2px solid var(--panel); box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    flex-shrink:0; background: var(--panel-hi);
  }
  .preview-titles{ padding-top:48px; min-width:0; }
  .preview-title-en{ font-weight:800; font-size:17px; line-height:1.25; color:var(--paper); }
  .preview-title-native{ font-size:12.5px; color:var(--teal); margin-top:3px; font-weight:500; }

  .preview-body{ padding: 16px 20px 28px; }

  .preview-chips{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px; }
  .chip{
    font-family:'JetBrains Mono', monospace; font-size:10px; font-weight:600;
    padding:4px 9px; border-radius:6px; border:1px solid var(--line); color:var(--muted);
    background: var(--panel-hi);
  }
  .chip.on-air{
    color: var(--signal); border-color: var(--signal-dim); background: rgba(232,72,44,0.1);
    display:flex; align-items:center; gap:5px;
  }
  .chip.on-air .lv-dot{ width:5px; height:5px; border-radius:50%; background:var(--signal); animation: livepulse 1.4s ease-in-out infinite; }
  .chip.score{ color: var(--gold); border-color: rgba(217,164,65,0.35); }

  .preview-desc{
    font-size:13px; line-height:1.65; color: #cfcdc6;
  }
  .preview-desc.clamp{
    display:-webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow:hidden;
  }
  .desc-toggle{
    background:none; border:none; color:var(--teal); font-size:12px; font-weight:700;
    cursor:pointer; padding:8px 0 0; font-family:'Inter',sans-serif;
  }

  .preview-facts{
    display:grid; grid-template-columns: repeat(3,1fr); gap:10px; margin: 16px 0;
  }
  .fact{ background: var(--panel-hi); border:1px solid var(--line); border-radius:10px; padding:8px 10px; }
  .fact .fk{ font-size:9.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; font-family:'JetBrains Mono', monospace; }
  .fact .fv{ font-size:13px; font-weight:700; color:var(--paper); margin-top:3px; font-family:'JetBrains Mono', monospace; }

  .preview-link{
    display:flex; align-items:center; justify-content:center; gap:8px;
    margin-top: 6px;
    background: var(--signal); color:#fff; text-decoration:none;
    font-weight:700; font-size:13px; padding:13px; border-radius:10px;
    transition: all .15s ease;
  }
  .preview-link:hover{ background:#ff5a3c; transform: translateY(-1px); }
  .preview-link:active{ transform: scale(0.98); }

  /* ═══════════════════ TABLET / iPAD ADAPTATIONS ═══════════════════ */

  /* Portrait tablet — iPad mini/Air/Pro portrait (>=700px width, taller than wide) */
  @media (min-width: 700px){
    :root{ --page-max: 760px; }
    h1{ font-size: 32px; }
    .clock-block .clock{ font-size: 24px; }

    #schedule-container{
      display:grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      background: transparent; border:none;
    }
    .card{
      flex-direction: column;
      border-radius: 14px;
      border: 1px solid var(--line);
      overflow: hidden;
    }
    .card:hover{ transform: translateY(-3px); box-shadow: 0 14px 32px -12px rgba(0,0,0,0.55); border-color: #3a3a42; }
    .time-col{
      width:auto; flex-direction:row; justify-content:space-between;
      border-right:none; border-bottom:1px solid var(--line);
      padding: 8px 12px;
    }
    .poster{ width:100%; height:180px; margin:0; border-radius:0; }
    .body{ padding: 12px 14px; }
    .title-en{ font-size:14.5px; white-space:normal; }
    .title-native{ white-space:normal; }

    .skeleton-wrap{ display:grid; grid-template-columns:repeat(2,1fr); gap:12px; background:transparent; border:none; }
    .skeleton-row{ flex-direction:column; align-items:stretch; border-radius:14px; border:1px solid var(--line); }
    .skel-poster{ width:100%; height:150px; }

    /* preview becomes a centered modal card, not a full bottom sheet */
    .preview-panel{
      left:50%; bottom:auto; top:50%;
      transform: translate(-50%,-46%) scale(0.94);
      opacity:0;
      width: min(520px, 90vw);
      max-height: 80vh;
      border-radius: 20px;
      border: 1px solid var(--line);
      transition: transform .3s cubic-bezier(.22,.9,.34,1), opacity .25s ease;
    }
    .preview-panel::before{ display:none; }
    .preview-overlay.open .preview-panel{ transform: translate(-50%,-50%) scale(1); opacity:1; }
  }

  /* Landscape tablet — iPad landscape (wide AND short-ish aspect) */
  @media (min-width: 980px) and (orientation: landscape){
    :root{ --page-max: 1040px; }
    body{
      display:grid;
      grid-template-rows: auto 1fr auto;
    }
    #schedule-container{ grid-template-columns: repeat(3, 1fr); }

    .day-nav{ flex-wrap:wrap; overflow:visible; }

    /* preview slides in as a right-hand broadcast monitor panel */
    .preview-panel{
      left:auto; right:0; top:0; bottom:0;
      width: min(420px, 40vw);
      max-height: 100vh;
      border-radius: 0;
      border-left: 1px solid var(--line);
      border-top:none;
      transform: translateX(100%);
    }
    .preview-panel::before{ display:none; }
    .preview-overlay.open .preview-panel{ transform: translateX(0); }
    .preview-banner{ height:190px; }
  }

  @media (min-width: 1180px){
    #schedule-container{ grid-template-columns: repeat(4, 1fr); }
  }
</style>
</head>
<body>

<header>
  <div class="channel-row">
    <div>
      <div class="ident-mark">
        <span class="ident-dot"></span>
        <span class="ident-label mono">ON AIR GUIDE</span>
      </div>
      <h1>วันนี้อนิเมะอะไรอัพ</h1>
      <div class="sub">ตารางออกอากาศจริงจาก AniList</div>
    </div>
    <div class="clock-block">
      <div class="clock mono" id="clock"></div>
      <div class="tz mono" id="tz"></div>
    </div>
  </div>
</header>

<main>
  <div class="tabs" id="tabs">
    <div class="tab active" data-mode="today">วันนี้</div>
    <div class="tab" data-mode="week">7 วันข้างหน้า</div>
  </div>

  <div class="day-nav" id="dayNav" style="display: none;"></div>

  <div class="refresh-row">
    <span class="status mono" id="statusText">กำลังโหลด...</span>
    <button class="refresh" id="refreshBtn">⟳ รีเฟรช</button>
  </div>

  <div id="schedule-container">
    <div class="skeleton-wrap" id="skeletonWrap">
      <div class="skeleton-row"><div class="skel skel-poster"></div><div class="skel-lines"><div class="skel skel-line" style="width:70%"></div><div class="skel skel-line" style="width:40%"></div><div class="skel skel-line" style="width:55%"></div></div></div>
      <div class="skeleton-row"><div class="skel skel-poster"></div><div class="skel-lines"><div class="skel skel-line" style="width:60%"></div><div class="skel skel-line" style="width:35%"></div><div class="skel skel-line" style="width:50%"></div></div></div>
      <div class="skeleton-row"><div class="skel skel-poster"></div><div class="skel-lines"><div class="skel skel-line" style="width:80%"></div><div class="skel skel-line" style="width:45%"></div><div class="skel skel-line" style="width:60%"></div></div></div>
    </div>
  </div>
</main>

<footer>ข้อมูลจาก <a href="https://anilist.co" target="_blank" rel="noopener">AniList.co</a></footer>

<!-- ── Preview Drawer ── -->
<div class="preview-overlay" id="previewOverlay">
  <div class="preview-backdrop" id="previewBackdrop"></div>
  <div class="preview-panel" id="previewPanel">
    <button class="preview-close" id="previewClose">✕</button>
    <div class="preview-scroll">
      <div class="preview-banner" id="previewBanner"></div>
      <div class="preview-head">
        <img class="preview-poster" id="previewPoster" alt="">
        <div class="preview-titles">
          <div class="preview-title-en" id="previewTitleEn"></div>
          <div class="preview-title-native" id="previewTitleNative"></div>
        </div>
      </div>
      <div class="preview-body">
        <div class="preview-chips" id="previewChips"></div>
        <div class="preview-desc clamp" id="previewDesc"></div>
        <button class="desc-toggle" id="descToggle" style="display:none;">อ่านเพิ่มเติม</button>
        <div class="preview-facts" id="previewFacts"></div>
        <a class="preview-link" id="previewLink" href="#" target="_blank" rel="noopener">เปิดใน AniList ↗</a>
      </div>
    </div>
  </div>
</div>

<script>
  const ANILIST_URL = 'https://graphql.anilist.co';
  let currentMode = 'today';
  let selectedOffset = 1; // ค่าเริ่มต้นเวลาเปิดโหมด 7 วันให้โชว์ของ 'พรุ่งนี้'
  let cache = { today: null, week: null };
  let countdownTimer = null;
  let itemIndex = {}; // key -> item, for preview lookups

  const QUERY = `
    query ($start: Int, $end: Int, $page: Int) {
      Page(page: $page, perPage: 50) {
        pageInfo { hasNextPage }
        airingSchedules(airingAt_greater: $start, airingAt_lesser: $end, sort: TIME) {
          airingAt
          episode
          media {
            title { romaji english native }
            format
            status
            episodes
            genres
            averageScore
            description(asHtml: false)
            coverImage { large medium }
            bannerImage
            studios(isMain: true) { nodes { name } }
            siteUrl
          }
        }
      }
    }
  `;

  function getRange(mode){
    const now = new Date();
    if(mode === 'today'){
      const start = new Date(now); start.setHours(0,0,0,0);
      const end = new Date(now); end.setHours(23,59,59,999);
      return { start: Math.floor(start.getTime()/1000), end: Math.floor(end.getTime()/1000) };
    } else {
      const start = new Date(now);
      const end = new Date(now); end.setDate(end.getDate() + 7);
      return { start: Math.floor(start.getTime()/1000), end: Math.floor(end.getTime()/1000) };
    }
  }

  async function fetchSchedule(mode){
    const { start, end } = getRange(mode);
    let allResults = [];
    let page = 1;
    let hasNext = true;

    while(hasNext && page <= 4){
      const res = await fetch(ANILIST_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify({ query: QUERY, variables: { start, end, page } })
      });
      if(!res.ok) throw new Error('AniList API error: ' + res.status);
      const json = await res.json();
      if(json.errors) throw new Error(json.errors[0]?.message || 'Unknown API error');
      const pageData = json.data.Page;
      allResults = allResults.concat(pageData.airingSchedules);
      hasNext = pageData.pageInfo.hasNextPage;
      page++;
    }
    return allResults;
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }

  function formatType(fmt){
    const map = { TV:'TV', TV_SHORT:'TV Short', MOVIE:'Movie', OVA:'OVA', ONA:'ONA', SPECIAL:'Special', MUSIC:'Music' };
    return map[fmt] || fmt || '';
  }

  function formatStatus(st){
    const map = { RELEASING:'กำลังฉาย', FINISHED:'จบแล้ว', NOT_YET_RELEASED:'ยังไม่ฉาย', CANCELLED:'ยกเลิก', HIATUS:'พักการฉาย' };
    return map[st] || st || '';
  }

  function countdownLabel(airingAt){
    const now = Date.now()/1000;
    const diff = airingAt - now;
    const hourWindow = 3600;

    if(diff <= 0 && diff > -hourWindow){
      return { text: '<span class="lv-dot"></span>ON AIR', live: true };
    }
    if(diff > 0 && diff <= hourWindow){
      const mins = Math.round(diff/60);
      return { text: `ใน ${mins} นาที`, live: false, soon: true };
    }
    if(diff <= -hourWindow){
      return { text: 'ออกอากาศแล้ว', live: false };
    }
    const hrs = diff/3600;
    if(hrs < 24){
      return { text: `ใน ${Math.round(hrs)} ชม.`, live: false };
    }
    const days = Math.round(hrs/24);
    return { text: `ใน ${days} วัน`, live: false };
  }

  function itemKey(item){
    const title = item.media.title.english || item.media.title.romaji;
    return `${title}-EP${item.episode}-${item.airingAt}`;
  }

  function createCard(item, delayIndex) {
    const m = item.media;
    const titleEn = m.title.english || m.title.romaji;
    const titleNative = m.title.romaji !== titleEn ? m.title.romaji : (m.title.native || '');
    const key = itemKey(item);
    itemIndex[key] = item;

    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.airingAt = item.airingAt;
    card.dataset.key = key;
    card.style.animationDelay = Math.min(delayIndex * 35, 400) + 'ms';
    card.setAttribute('role','button');
    card.setAttribute('tabindex','0');

    const timeFormatted = new Date(item.airingAt * 1000).toLocaleTimeString('th-TH', { hour:'2-digit', minute:'2-digit' });
    const cd = countdownLabel(item.airingAt);

    card.innerHTML = `
      <div class="time-col">
        <span class="t mono">${timeFormatted}</span>
        <span class="countdown mono ${cd.live ? 'live' : ''}">${cd.text}</span>
      </div>
      <img class="poster" src="${m.coverImage.large || m.coverImage.medium}" alt="${escapeHtml(titleEn)}" loading="lazy">
      <div class="body">
        <div class="title-en" title="${escapeHtml(titleEn)}">${escapeHtml(titleEn)}</div>
        ${titleNative ? `<div class="title-native" title="${escapeHtml(titleNative)}">${escapeHtml(titleNative)}</div>` : ''}
        <div class="meta">
          <span class="ep">EP ${item.episode}</span>
          <span class="fmt">${formatType(m.format)}</span>
        </div>
      </div>
    `;

    const openHandler = (e) => { e.preventDefault(); openPreview(key); };
    card.addEventListener('click', openHandler);
    card.addEventListener('keydown', (e) => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openPreview(key); } });

    return card;
  }

  function renderList(list, groupByDay=false){
    const container = document.getElementById('schedule-container');
    container.innerHTML = '';

    if(!list || list.length === 0){
      container.innerHTML = '<div class="empty">ไม่พบข้อมูลอนิเมะที่ออกอากาศ</div>';
      document.getElementById('statusText').innerHTML = `พบ <b>0</b> ตอน`;
      return;
    }

    const seen = new Set();
    const uniqueList = list.filter(item => {
      const title = item.media.title.english || item.media.title.romaji;
      const key = `${title}-EP${item.episode}`;
      if(seen.has(key)) return false;
      seen.add(key);
      return true;
    });

    uniqueList.forEach((item, i) => container.appendChild(createCard(item, i)));

    document.getElementById('statusText').innerHTML = `พบ <b>${uniqueList.length}</b> ตอน`;
  }

  function renderDayNav() {
    const dayNav = document.getElementById('dayNav');
    dayNav.innerHTML = '';
    const dayNames = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
    const today = new Date();
    today.setHours(0,0,0,0);

    for(let i = 0; i < 7; i++) {
      const d = new Date(today);
      d.setDate(today.getDate() + i);

      const btn = document.createElement('div');
      btn.className = 'day-btn' + (i === selectedOffset ? ' active' : '');
      btn.innerHTML = `<span class="d-name">${dayNames[d.getDay()]}</span><span class="d-num">${d.getDate()}</span>`;

      btn.onclick = () => {
        selectedOffset = i;
        renderCurrentView();
      };

      dayNav.appendChild(btn);
    }
  }

  function renderCurrentView() {
    const dayNav = document.getElementById('dayNav');

    if(currentMode === 'today') {
      dayNav.style.display = 'none';
      renderList(cache.today);
    } else {
      dayNav.style.display = 'flex';
      renderDayNav();

      if(cache.week) {
        const today = new Date();
        today.setHours(0,0,0,0);
        const targetDay = new Date(today);
        targetDay.setDate(today.getDate() + selectedOffset);

        const filtered = cache.week.filter(item => {
          const d = new Date(item.airingAt * 1000);
          return d.getFullYear() === targetDay.getFullYear() &&
                 d.getMonth() === targetDay.getMonth() &&
                 d.getDate() === targetDay.getDate();
        });
        renderList(filtered);
      }
    }
  }

  function refreshCountdowns(){
    document.querySelectorAll('.card').forEach(card => {
      const airingAt = parseFloat(card.dataset.airingAt);
      if(!airingAt) return;
      const cd = countdownLabel(airingAt);
      const el = card.querySelector('.countdown');
      if(el){
        el.innerHTML = cd.text;
        el.classList.toggle('live', !!cd.live);
      }
    });
  }

  async function load(mode, forceRefresh=false){
    const container = document.getElementById('schedule-container');
    const btn = document.getElementById('refreshBtn');
    const statusEl = document.getElementById('statusText');

    if(!cache[mode] || forceRefresh){
      container.innerHTML = document.getElementById('skeletonWrap') ? document.getElementById('skeletonWrap').outerHTML : '<div class="loading">กำลังดึงข้อมูล<span class="dot">...</span></div>';
      statusEl.textContent = 'กำลังโหลด...';
      btn.disabled = true;
      btn.innerHTML = '<span class="spin">⟳</span> โหลด';

      try{
        cache[mode] = await fetchSchedule(mode);
      }catch(err){
        container.innerHTML = `<div class="error">โหลดข้อมูลไม่สำเร็จ: ${escapeHtml(err.message)}<br><br>ลองกดรีเฟรชอีกครั้ง</div>`;
        statusEl.textContent = 'เกิดข้อผิดพลาด';
        btn.disabled = false;
        btn.innerHTML = '⟳ รีเฟรช';
        return;
      }
    }

    renderCurrentView();

    btn.disabled = false;
    btn.innerHTML = '⟳ รีเฟรช';
  }

  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      currentMode = tab.dataset.mode;

      if (currentMode === 'week' && selectedOffset === 0) {
        selectedOffset = 1;
      }

      load(currentMode);
    });
  });

  document.getElementById('refreshBtn').addEventListener('click', () => {
    load(currentMode, true);
  });

  function updateClock(){
    const now = new Date();
    document.getElementById('clock').innerHTML = now.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'});
    const tzOffset = -now.getTimezoneOffset()/60;
    document.getElementById('tz').textContent = `UTC${tzOffset >= 0 ? '+' : ''}${tzOffset}`;
  }
  updateClock();
  setInterval(updateClock, 30000);
  countdownTimer = setInterval(refreshCountdowns, 30000);

  /* ═══════════════════ PREVIEW DRAWER LOGIC ═══════════════════ */
  const overlay = document.getElementById('previewOverlay');
  const panel = document.getElementById('previewPanel');

  function openPreview(key){
    const item = itemIndex[key];
    if(!item) return;
    const m = item.media;
    const titleEn = m.title.english || m.title.romaji;
    const titleNative = m.title.romaji !== titleEn ? m.title.romaji : (m.title.native || '');

    document.getElementById('previewBanner').style.backgroundImage =
      `url('${m.bannerImage || m.coverImage.large}')`;
    document.getElementById('previewPoster').src = m.coverImage.large || m.coverImage.medium;
    document.getElementById('previewPoster').alt = titleEn;
    document.getElementById('previewTitleEn').textContent = titleEn;
    document.getElementById('previewTitleNative').textContent = titleNative;

    const cd = countdownLabel(item.airingAt);
    const chips = [];
    chips.push(`<span class="chip ${cd.live ? 'on-air' : ''}">${cd.live ? '<span class="lv-dot"></span>' : ''}${cd.live ? 'กำลังออกอากาศ' : new Date(item.airingAt*1000).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'})}</span>`);
    chips.push(`<span class="chip">${formatType(m.format)}</span>`);
    if(m.status) chips.push(`<span class="chip">${formatStatus(m.status)}</span>`);
    if(m.averageScore) chips.push(`<span class="chip score">★ ${m.averageScore}%</span>`);
    (m.genres || []).slice(0,3).forEach(g => chips.push(`<span class="chip">${escapeHtml(g)}</span>`));
    document.getElementById('previewChips').innerHTML = chips.join('');

    const descEl = document.getElementById('previewDesc');
    const toggleBtn = document.getElementById('descToggle');
    const rawDesc = (m.description || 'ยังไม่มีเรื่องย่อสำหรับเรื่องนี้').replace(/<br\s*\/?>/gi, ' ').replace(/<[^>]+>/g, '');
    descEl.textContent = rawDesc;
    descEl.classList.add('clamp');
    toggleBtn.style.display = rawDesc.length > 200 ? 'block' : 'none';
    toggleBtn.textContent = 'อ่านเพิ่มเติม';
    toggleBtn.onclick = () => {
      const clamped = descEl.classList.toggle('clamp');
      toggleBtn.textContent = clamped ? 'อ่านเพิ่มเติม' : 'ย่อข้อความ';
    };

    const studioName = (m.studios && m.studios.nodes && m.studios.nodes[0]) ? m.studios.nodes[0].name : '—';
    document.getElementById('previewFacts').innerHTML = `
      <div class="fact"><div class="fk">ตอน</div><div class="fv">EP ${item.episode}${m.episodes ? ' / ' + m.episodes : ''}</div></div>
      <div class="fact"><div class="fk">สตูดิโอ</div><div class="fv" style="font-size:11px;">${escapeHtml(studioName)}</div></div>
      <div class="fact"><div class="fk">รูปแบบ</div><div class="fv">${formatType(m.format)}</div></div>
    `;

    document.getElementById('previewLink').href = m.siteUrl;

    overlay.classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closePreview(){
    overlay.classList.remove('open');
    document.body.style.overflow = '';
  }

  document.getElementById('previewClose').addEventListener('click', closePreview);
  document.getElementById('previewBackdrop').addEventListener('click', closePreview);
  document.addEventListener('keydown', (e) => { if(e.key === 'Escape') closePreview(); });

  load('today');
</script>

</body>
</html>
