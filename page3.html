<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เกมหยุดเวลา (Time Stop Game)</title>
    <style>
        body {
            font-family: 'Sarabun', sans-serif;
            background-color: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .game-container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            text-align: center;
            width: 100%;
            max-width: 400px;
        }
        h1 {
            color: #333;
            margin-top: 0;
        }
        .mode-selector {
            margin: 20px 0;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
        }
        .mode-selector label {
            margin: 0 10px;
            cursor: pointer;
        }
        #custom-target {
            margin-top: 10px;
            padding: 8px;
            width: 100px;
            text-align: center;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
            display: none;
        }
        .target-box {
            font-size: 20px;
            color: #555;
            margin: 20px 0;
        }
        #target-display {
            font-size: 28px;
            font-weight: bold;
            color: #007bff;
        }
        .timer-display {
            font-size: 60px;
            font-weight: bold;
            font-variant-numeric: tabular-nums;
            margin: 20px 0;
            color: #333;
        }
        .btn {
            font-size: 24px;
            padding: 15px 40px;
            border: none;
            border-radius: 50px;
            color: white;
            background-color: #28a745;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 80%;
        }
        .btn:active {
            transform: scale(0.95);
        }
        .btn.stop {
            background-color: #dc3545;
        }
        .btn.reset {
            background-color: #007bff;
        }
        #result {
            margin-top: 25px;
            font-size: 18px;
            font-weight: bold;
            min-height: 25px;
        }
    </style>
</head>
<body>

<div class="game-container">
    <h1>⏱️ เกมหยุดเวลา</h1>
    
    <div class="mode-selector">
        <label>
            <input type="radio" name="mode" value="random" checked> สุ่มโจทย์
        </label>
        <label>
            <input type="radio" name="mode" value="custom"> กำหนดเอง
        </label>
        <br>
        <input type="number" id="custom-target" placeholder="วิ (เช่น 5.5)" step="0.1" min="0.1">
    </div>

    <div class="target-box">
        เป้าหมาย: <br>
        <span id="target-display">0.000</span> วินาที
    </div>

    <div class="timer-display" id="timer-display">0.000</div>

    <button class="btn" id="action-btn">เริ่ม!</button>

    <div id="result"></div>
</div>

<script>
    let isRunning = false;
    let startTime = 0;
    let timerFrame;
    let targetTime = 5.000;
    let stoppedTime = 0;

    const actionBtn = document.getElementById('action-btn');
    const timerDisplay = document.getElementById('timer-display');
    const targetDisplay = document.getElementById('target-display');
    const resultDiv = document.getElementById('result');
    const modeRadios = document.getElementsByName('mode');
    const customInput = document.getElementById('custom-target');

    // ฟังก์ชันสำหรับตั้งค่าเวลาเป้าหมาย
    function initTarget() {
        const selectedMode = document.querySelector('input[name="mode"]:checked').value;
        
        if (selectedMode === 'random') {
            // สุ่มเวลาตั้งแต่ 2.000 ถึง 10.000 วินาที
            targetTime = (Math.random() * 8 + 2).toFixed(3);
        } else {
            // ดึงค่าจากช่องกรอก หากไม่ใส่ให้เริ่มต้นที่ 5 วินาที
            let val = parseFloat(customInput.value);
            targetTime = (isNaN(val) || val <= 0) ? 5.000 : val;
            targetTime = parseFloat(targetTime).toFixed(3);
        }
        
        targetDisplay.textContent = targetTime;
        if (!isRunning) {
            timerDisplay.textContent = "0.000";
            resultDiv.textContent = "";
        }
    }

    // จัดการเมื่อเปลี่ยนโหมดเกม
    modeRadios.forEach(radio => {
        radio.addEventListener('change', (e) => {
            if (e.target.value === 'custom') {
                customInput.style.display = 'inline-block';
            } else {
                customInput.style.display = 'none';
            }
            if (!isRunning) initTarget();
        });
    });

    // อัปเดตเป้าหมายทันทีที่พิมพ์
    customInput.addEventListener('input', () => {
        if (!isRunning) initTarget();
    });

    // ฟังก์ชันอัปเดตหน้าจอตัวจับเวลา (ใช้ requestAnimationFrame เพื่อความสมูทและแม่นยำ)
    function updateTimer() {
        const now = Date.now();
        const diff = (now - startTime) / 1000;
        timerDisplay.textContent = diff.toFixed(3);
        timerFrame = requestAnimationFrame(updateTimer);
    }

    // จัดการปุ่ม เริ่ม/หยุด/เริ่มใหม่
    actionBtn.addEventListener('click', () => {
        if (!isRunning && actionBtn.textContent !== 'เล่นอีกครั้ง') {
            // สถานะ: กดเพื่อ "เริ่ม"
            initTarget(); // อัปเดตเป้าหมายใหม่ทุกครั้งที่เริ่ม
            isRunning = true;
            actionBtn.textContent = 'หยุด!';
            actionBtn.className = 'btn stop';
            resultDiv.textContent = "";
            startTime = Date.now();
            timerFrame = requestAnimationFrame(updateTimer);
        } 
        else if (isRunning) {
            // สถานะ: กดเพื่อ "หยุด"
            isRunning = false;
            cancelAnimationFrame(timerFrame);
            const now = Date.now();
            stoppedTime = (now - startTime) / 1000;
            timerDisplay.textContent = stoppedTime.toFixed(3);
            actionBtn.textContent = 'เล่นอีกครั้ง';
            actionBtn.className = 'btn reset';
            checkResult();
        } 
        else {
            // สถานะ: กดเพื่อ "เล่นอีกครั้ง"
            timerDisplay.textContent = "0.000";
            resultDiv.textContent = "";
            actionBtn.textContent = 'เริ่ม!';
            actionBtn.className = 'btn';
            initTarget();
        }
    });

    // ตรวจสอบผลลัพธ์
    function checkResult() {
        const diff = Math.abs(targetTime - stoppedTime);
        
        if (diff === 0) {
            resultDiv.innerHTML = "Perfect! หยุดได้เป๊ะ 100% 🎉";
            resultDiv.style.color = "#28a745"; // สีเขียว
        } else if (diff <= 0.050) {
            resultDiv.innerHTML = `สุดยอด! คลาดเคลื่อนแค่ ${diff.toFixed(3)} วิ 😲`;
            resultDiv.style.color = "#fd7e14"; // สีส้ม
        } else if (diff <= 0.200) {
            resultDiv.innerHTML = `เกือบไปแล้ว! พลาดไป ${diff.toFixed(3)} วิ 😉`;
            resultDiv.style.color = "#ffc107"; // สีเหลือง
        } else {
            let earlyOrLate = stoppedTime < targetTime ? "เร็วไป" : "ช้าไป";
            resultDiv.innerHTML = `คุณกด${earlyOrLate} ${diff.toFixed(3)} วิ 😅`;
            resultDiv.style.color = "#dc3545"; // สีแดง
        }
    }

    // เริ่มต้นระบบ
    initTarget();
</script>

</body>
</html>
