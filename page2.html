
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>วันนี้อนิเมะอะไรอัพ — On Air Guide (HUD Edition)</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap');

  :root {
    --bg: #050508;
    --panel: rgba(15, 15, 20, 0.65);
    --panel-hi: rgba(30, 30, 40, 0.85);
    --line: rgba(61, 154, 130, 0.2);
    --line-glow: rgba(61, 154, 130, 0.5);
    --paper: #f0f4f8;
    --muted: #8c97a7;
    --signal: #ff3b30;   
    --signal-dim: #5c1616;
    --teal: #00f0ff;     
    --gold: #ffcc00;     
    --page-max: 1200px;
    --glass-blur: blur(12px);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { scroll-behavior: smooth; }
  
  body {
    margin: 0;
    min-height: 100vh;
    background-color: var(--bg);
    /* Sci-Fi Grid Background */
    background-image: 
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px),
      radial-gradient(circle at 50% 0%, rgba(0, 240, 255, 0.1), transparent 50%);
    background-size: 40px 40px, 40px 40px, 100% 100%;
    color: var(--paper);
    font-family: 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  .mono { font-family: 'JetBrains Mono', monospace; }
  
  header, main { max-width: var(--page-max); margin: 0 auto; }

  /* ── HEADER ── */
  header {
    padding: 24px 20px;
    background: linear-gradient(180deg, rgba(5,5,8,0.9) 0%, transparent 100%);
    border-bottom: 1px solid rgba(0, 240, 255, 0.15);
    backdrop-filter: var(--glass-blur);
    position: sticky;
    top: 0;
    z-index: 50;
  }
  .channel-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
  
  .ident-mark { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .ident-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--signal);
    box-shadow: 0 0 8px var(--signal), 0 0 0 3px var(--signal-dim);
    animation: livepulse 1.5s ease-in-out infinite;
  }
  @keyframes livepulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.85); box-shadow: 0 0 2px var(--signal); }
  }
  .ident-label {
    font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.25em; 
    color: var(--signal); font-weight: 700; text-shadow: 0 0 5px rgba(255,59,48,0.5);
  }
  
  h1 {
    margin: 0; font-family: 'Archivo Black', sans-serif; font-size: 28px;
    background: linear-gradient(90deg, #fff, var(--teal));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-transform: uppercase; letter-spacing: 1px;
    filter: drop-shadow(0 0 8px rgba(0,240,255,0.3));
  }
  .clock-block { text-align: right; }
  .clock { font-size: 22px; font-weight: 700; color: var(--teal); text-shadow: 0 0 10px rgba(0,240,255,0.4); }

  /* ── HERO SLIDER (อลังการ) ── */
  .hero-container {
    width: 100%; height: 55vh; min-height: 400px; max-height: 600px;
    position: relative; overflow: hidden;
    border-bottom: 2px solid var(--line-glow);
    background: #000;
  }
  .hero-slide {
    position: absolute; inset: 0; opacity: 0; transition: opacity 0.8s ease-in-out, transform 4s ease-out;
    transform: scale(1.05); z-index: 1;
  }
  .hero-slide.active { opacity: 1; transform: scale(1); z-index: 2; }
  .hero-img { width: 100%; height: 100%; object-fit: cover; opacity: 0.6; }
  .hero-gradient {
    position: absolute; inset: 0;
    background: linear-gradient(0deg, var(--bg) 0%, rgba(5,5,8,0.2) 50%, transparent 100%);
  }
  .hero-content {
    position: absolute; bottom: 0; left: 0; width: 100%; padding: 40px 20px;
    max-width: var(--page-max); margin: 0 auto; left: 50%; transform: translateX(-50%);
  }
  .hero-tag {
    display: inline-block; padding: 4px 10px; background: rgba(0, 240, 255, 0.2);
    border: 1px solid var(--teal); color: var(--teal); font-size: 11px;
    border-radius: 4px; font-family: 'JetBrains Mono', monospace; font-weight: 700;
    margin-bottom: 12px; backdrop-filter: blur(4px); box-shadow: 0 0 10px rgba(0,240,255,0.2);
  }
  .hero-title {
    font-size: clamp(24px, 5vw, 42px); font-weight: 800; line-height: 1.1;
    text-shadow: 0 4px 20px rgba(0,0,0,0.8); margin-bottom: 8px;
  }
  .hero-desc {
    font-size: 14px; color: var(--muted); max-width: 600px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }

  .slider-nav {
    position: absolute; bottom: 20px; right: 20px; z-index: 10; display: flex; gap: 8px;
  }
  .slider-dot {
    width: 12px; height: 4px; background: rgba(255,255,255,0.2); border-radius: 2px;
    cursor: pointer; transition: all 0.3s ease;
  }
  .slider-dot.active { background: var(--teal); width: 24px; box-shadow: 0 0 8px var(--teal); }

  /* ── MAIN CONTENT ── */
  main { padding: 30px 20px 80px; }

  /* ── TABS (HUD Style) ── */
  .tabs { display: flex; gap: 10px; margin-bottom: 24px; }
  .tab {
    flex: 1; padding: 12px; text-align: center; font-size: 13px; font-weight: 700;
    background: rgba(0, 240, 255, 0.05); border: 1px solid rgba(0, 240, 255, 0.2);
    color: var(--muted); cursor: pointer; transition: all 0.2s;
    text-transform: uppercase; letter-spacing: 1px; clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
  }
  .tab.active {
    background: rgba(0, 240, 255, 0.15); color: var(--teal); border-color: var(--teal);
    box-shadow: inset 0 0 15px rgba(0, 240, 255, 0.1);
  }

  /* ── DAY NAV ── */
  .day-nav { display: flex; gap: 8px; margin-bottom: 24px; overflow-x: auto; padding-bottom: 4px; }
  .day-nav::-webkit-scrollbar { height: 4px; }
  .day-nav::-webkit-scrollbar-thumb { background: var(--line-glow); border-radius: 2px; }
  .day-btn {
    background: var(--panel); border: 1px solid var(--line); color: var(--muted);
    padding: 10px 14px; border-radius: 8px; font-family: 'JetBrains Mono', monospace;
    cursor: pointer; min-width: 60px; text-align: center; transition: all 0.2s;
    backdrop-filter: var(--glass-blur);
  }
  .day-btn .d-num { font-size: 18px; font-weight: 700; display: block; margin-top: 4px; }
  .day-btn.active {
    background: rgba(0, 240, 255, 0.1); border-color: var(--teal); color: var(--paper);
    box-shadow: 0 0 15px rgba(0, 240, 255, 0.15);
  }

  .refresh-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .status { font-size: 12px; color: var(--muted); font-family: 'JetBrains Mono'; }
  .status b { color: var(--teal); font-size: 14px; }
  
  button.refresh {
    background: transparent; border: 1px solid var(--teal); color: var(--teal);
    padding: 8px 16px; border-radius: 4px; font-family: 'JetBrains Mono', monospace;
    font-size: 12px; cursor: pointer; transition: all 0.2s; text-transform: uppercase;
  }
  button.refresh:hover { background: rgba(0, 240, 255, 0.1); box-shadow: 0 0 10px rgba(0,240,255,0.3); }

  /* ── GRID & CARDS (Glassmorphism) ── */
  #schedule-container {
    display: grid; grid-template-columns: 1fr; gap: 16px;
  }
  
  .card {
    display: flex; background: var(--panel); border: 1px solid rgba(255,255,255,0.05);
    border-radius: 12px; overflow: hidden; backdrop-filter: var(--glass-blur);
    cursor: pointer; transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
    position: relative; opacity: 0; animation: cardIn 0.5s ease forwards;
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
  }
  
  .card::before {
    content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%;
    background: var(--teal); opacity: 0; transition: opacity 0.2s;
  }
  .card:hover { transform: translateY(-3px); border-color: rgba(0, 240, 255, 0.4); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
  .card:hover::before { opacity: 1; box-shadow: 0 0 10px var(--teal); }

  .time-col {
    padding: 16px; min-width: 80px; text-align: center; border-right: 1px solid rgba(255,255,255,0.05);
    display: flex; flex-direction: column; justify-content: center; background: rgba(0,0,0,0.2);
  }
  .time-col .t { font-size: 16px; font-weight: 700; color: var(--paper); }
  .time-col .countdown { font-size: 10px; color: var(--muted); margin-top: 6px; }
  .time-col .countdown.live { color: var(--signal); font-weight: 700; text-shadow: 0 0 5px rgba(255,59,48,0.5); }
  
  .poster { width: 70px; height: 100px; object-fit: cover; flex-shrink: 0; }
  
  .body { padding: 14px 16px; flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
  .title-en { font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; }
  .title-native { font-size: 12px; color: var(--teal); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: 0.8; }
  .meta { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
  .ep { background: var(--teal); color: #000; padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: 800; }
  
  /* ── SKELETON (Shimmer) ── */
  .skeleton-wrap { display: grid; grid-template-columns: 1fr; gap: 16px; width: 100%; }
  .skeleton-row { display: flex; background: var(--panel); border-radius: 12px; padding: 16px; gap: 16px; }
  .skel {
    background: linear-gradient(90deg, rgba(255,255,255,0.05) 25%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0.05) 75%);
    background-size: 200% 100%; animation: shimmer 1.5s infinite linear; border-radius: 4px;
  }
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  
  /* ── PREVIEW PANEL (Monitor HUD) ── */
  .preview-overlay { position: fixed; inset: 0; z-index: 100; visibility: hidden; pointer-events: none; }
  .preview-overlay.open { visibility: visible; pointer-events: auto; }
  .preview-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); opacity: 0; transition: 0.3s; }
  .preview-overlay.open .preview-backdrop { opacity: 1; }

  .preview-panel {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -45%) scale(0.95); opacity: 0;
    width: min(600px, 95vw); max-height: 85vh; background: rgba(10,10,15,0.9);
    border: 1px solid var(--teal); border-radius: 16px; overflow: hidden;
    box-shadow: 0 0 40px rgba(0, 240, 255, 0.15), inset 0 0 20px rgba(0, 240, 255, 0.05);
    transition: all 0.3s cubic-bezier(0.2, 0.9, 0.3, 1); display: flex; flex-direction: column;
  }
  .preview-overlay.open .preview-panel { transform: translate(-50%, -50%) scale(1); opacity: 1; }
  
  .preview-banner { height: 180px; background-size: cover; background-position: center; position: relative; }
  .preview-banner::after { content: ''; position: absolute; inset: 0; background: linear-gradient(0deg, rgba(10,10,15,1) 0%, transparent 100%); }
  /* Scanline FX */
  .preview-banner::before {
    content: ''; position: absolute; inset: 0; z-index: 1; mix-blend-mode: overlay;
    background: repeating-linear-gradient(180deg, transparent 0, transparent 2px, rgba(0,240,255,0.2) 3px);
  }

  .preview-scroll { overflow-y: auto; padding: 0 24px 24px; position: relative; z-index: 2; margin-top: -60px; }
  .preview-head { display: flex; gap: 20px; align-items: flex-end; margin-bottom: 20px; }
  .preview-poster { width: 100px; height: 140px; border-radius: 8px; border: 2px solid var(--teal); box-shadow: 0 10px 20px rgba(0,0,0,0.5); object-fit: cover; background: #000; }
  
  .preview-title-en { font-size: 20px; font-weight: 800; margin-bottom: 4px; }
  .preview-title-native { color: var(--teal); font-size: 13px; }
  
  .chip { padding: 4px 10px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); font-size: 11px; font-family: 'JetBrains Mono'; }
  .preview-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
  
  .preview-desc { font-size: 14px; line-height: 1.6; color: #b0bac5; background: rgba(0,0,0,0.3); padding: 16px; border-radius: 8px; border-left: 2px solid var(--teal); }
  
  .preview-link {
    display: block; text-align: center; margin-top: 24px; background: var(--teal); color: #000;
    padding: 14px; border-radius: 8px; font-weight: 800; text-decoration: none; text-transform: uppercase;
    transition: 0.2s; box-shadow: 0 0 15px rgba(0,240,255,0.3);
  }
  .preview-link:hover { background: #fff; box-shadow: 0 0 20px #fff; }
  
  .preview-close {
    position: absolute; top: 16px; right: 16px; z-index: 10; width: 32px; height: 32px;
    background: rgba(0,0,0,0.5); border: 1px solid var(--teal); color: var(--teal); border-radius: 50%;
    cursor: pointer; display: grid; place-items: center; transition: 0.2s; backdrop-filter: blur(4px);
  }
  .preview-close:hover { background: var(--teal); color: #000; transform: rotate(90deg); }

  /* ── RESPONSIVE ADAPTATIONS ── */
  @media (min-width: 768px) {
    #schedule-container { grid-template-columns: repeat(2, 1fr); }
    .skeleton-wrap { grid-template-columns: repeat(2, 1fr); }
    .card { flex-direction: column; }
    .time-col { border-right: none; border-bottom: 1px solid rgba(255,255,255,0.05); flex-direction: row; justify-content: space-between; align-items: center; padding: 12px 16px; }
    .time-col .countdown { margin-top: 0; }
    .poster { width: 100%; height: 200px; }
  }
  @media (min-width: 1024px) {
    #schedule-container { grid-template-columns: repeat(3, 1fr); }
    .skeleton-wrap { grid-template-columns: repeat(3, 1fr); }
    .hero-container { height: 60vh; }
    .hero-content { padding-bottom: 60px; }
  }
  @media (min-width: 1280px) {
    #schedule-container { grid-template-columns: repeat(4, 1fr); }
    .skeleton-wrap { grid-template-columns: repeat(4, 1fr); }
  }
</style>
</head>
<body>

<header>
  <div class="channel-row">
    <div>
      <div class="ident-mark">
        <span class="ident-dot"></span>
        <span class="ident-label mono">SYS.ON_AIR_MONITOR</span>
      </div>
      <h1>วันนี้อนิเมะอะไรอัพ</h1>
    </div>
    <div class="clock-block">
      <div class="clock mono" id="clock">00:00</div>
      <div class="status mono">LOCAL TIME</div>
    </div>
  </div>
</header>

<div class="hero-container" id="heroContainer" style="display: none;">
  <div id="heroSlider"></div>
  <div class="slider-nav" id="sliderNav"></div>
</div>

<main>
  <div class="tabs" id="tabs">
    <div class="tab active" data-mode="today">DAILY SCAN (วันนี้)</div>
    <div class="tab" data-mode="week">FORECAST (7 วัน)</div>
  </div>

  <div class="day-nav" id="dayNav" style="display: none;"></div>

  <div class="refresh-row">
    <span class="status mono" id="statusText">SYSTEM STANDBY...</span>
    <button class="refresh" id="refreshBtn">REBOOT SCAN ⟳</button>
  </div>

  <div id="schedule-container">
    <div class="skeleton-wrap" id="skeletonWrap">
      <div class="skeleton-row"><div class="skel" style="width:70px;height:100px;"></div><div style="flex:1"><div class="skel" style="height:15px;width:80%;margin-bottom:8px;"></div><div class="skel" style="height:10px;width:50%;"></div></div></div>
      <div class="skeleton-row"><div class="skel" style="width:70px;height:100px;"></div><div style="flex:1"><div class="skel" style="height:15px;width:60%;margin-bottom:8px;"></div><div class="skel" style="height:10px;width:40%;"></div></div></div>
      <div class="skeleton-row"><div class="skel" style="width:70px;height:100px;"></div><div style="flex:1"><div class="skel" style="height:15px;width:90%;margin-bottom:8px;"></div><div class="skel" style="height:10px;width:60%;"></div></div></div>
    </div>
  </div>
</main>

<div class="preview-overlay" id="previewOverlay">
  <div class="preview-backdrop" id="previewBackdrop"></div>
  <div class="preview-panel">
    <button class="preview-close" id="previewClose">✕</button>
    <div class="preview-banner" id="previewBanner"></div>
    <div class="preview-scroll">
      <div class="preview-head">
        <img class="preview-poster" id="previewPoster" src="" alt="">
        <div>
          <div class="preview-title-en" id="previewTitleEn"></div>
          <div class="preview-title-native" id="previewTitleNative"></div>
        </div>
      </div>
      <div class="preview-chips" id="previewChips"></div>
      <div class="preview-desc" id="previewDesc"></div>
      <a class="preview-link" id="previewLink" href="#" target="_blank" rel="noopener">Access Database ↗</a>
    </div>
  </div>
</div>

<script>
  const ANILIST_URL = 'https://graphql.anilist.co';
  let currentMode = 'today';
  let selectedOffset = 0; // Fix: ค่าเริ่มต้นให้เป็น 0 (วันนี้) เพื่อความต่อเนื่อง
  let cache = { today: null, week: null };
  let itemIndex = {}; 
  
  // Slider Data
  let slideInterval;
  let currentSlide = 0;

  const QUERY = `
    query ($start: Int, $end: Int, $page: Int) {
      Page(page: $page, perPage: 50) {
        pageInfo { hasNextPage }
        airingSchedules(airingAt_greater: $start, airingAt_lesser: $end, sort: TIME) {
          airingAt
          episode
          media {
            title { romaji english native }
            format status episodes genres averageScore
            description(asHtml: false)
            coverImage { large medium }
            bannerImage
            siteUrl
          }
        }
      }
    }
  `;

  function getRange(mode){
    const now = new Date();
    if(mode === 'today'){
      const start = new Date(now); start.setHours(0,0,0,0);
      const end = new Date(now); end.setHours(23,59,59,999);
      return { start: Math.floor(start.getTime()/1000), end: Math.floor(end.getTime()/1000) };
    } else {
      const start = new Date(now); start.setHours(0,0,0,0); // ให้เริ่มตัดตั้งแต่ต้นวันปัจจุบัน
      const end = new Date(now); end.setDate(end.getDate() + 7); end.setHours(23,59,59,999);
      return { start: Math.floor(start.getTime()/1000), end: Math.floor(end.getTime()/1000) };
    }
  }

  async function fetchSchedule(mode){
    const { start, end } = getRange(mode);
    let allResults = [];
    let page = 1;
    let hasNext = true;

    while(hasNext && page <= 4){
      const res = await fetch(ANILIST_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify({ query: QUERY, variables: { start, end, page } })
      });
      if(!res.ok) throw new Error('API Sync Failed: ' + res.status);
      const json = await res.json();
      allResults = allResults.concat(json.data.Page.airingSchedules);
      hasNext = json.data.Page.pageInfo.hasNextPage;
      page++;
    }
    return allResults;
  }

  // ==== Hero Slider Logic ====
  function buildHeroSlider(list) {
    if(!list || list.length === 0) return;
    const heroContainer = document.getElementById('heroContainer');
    const slider = document.getElementById('heroSlider');
    const nav = document.getElementById('sliderNav');
    
    // กรองหาตัวที่มีแบนเนอร์และคะแนนสูงสุด 5 อันดับแรก
    const topPicks = list
      .filter(item => item.media.bannerImage)
      .sort((a, b) => (b.media.averageScore || 0) - (a.media.averageScore || 0))
      .slice(0, 5);

    if (topPicks.length === 0) return;

    slider.innerHTML = ''; nav.innerHTML = '';
    
    topPicks.forEach((item, index) => {
      const m = item.media;
      const title = m.title.english || m.title.romaji;
      
      const slide = document.createElement('div');
      slide.className = `hero-slide ${index === 0 ? 'active' : ''}`;
      slide.innerHTML = `
        <img class="hero-img" src="${m.bannerImage}" alt="Banner">
        <div class="hero-gradient"></div>
        <div class="hero-content">
          <div class="hero-tag">FEATURED BROADCAST</div>
          <div class="hero-title">${title}</div>
          <div class="hero-desc">${m.description ? m.description.replace(/<[^>]+>/g, '') : 'No description available in the database.'}</div>
        </div>
      `;
      slider.appendChild(slide);

      const dot = document.createElement('div');
      dot.className = `slider-dot ${index === 0 ? 'active' : ''}`;
      dot.onclick = () => goToSlide(index);
      nav.appendChild(dot);
    });

    heroContainer.style.display = 'block';
    
    clearInterval(slideInterval);
    slideInterval = setInterval(() => {
      currentSlide = (currentSlide + 1) % topPicks.length;
      goToSlide(currentSlide);
    }, 6000); // เปลี่ยนสไลด์ทุก 6 วินาที
  }

  function goToSlide(index) {
    currentSlide = index;
    const slides = document.querySelectorAll('.hero-slide');
    const dots = document.querySelectorAll('.slider-dot');
    slides.forEach((s, i) => s.classList.toggle('active', i === index));
    dots.forEach((d, i) => d.classList.toggle('active', i === index));
  }

  // ==== Card & Listing Logic ====
  function countdownLabel(airingAt){
    const diff = airingAt - (Date.now()/1000);
    if(diff <= 0 && diff > -3600) return { text: '<span class="ident-dot" style="display:inline-block;width:6px;height:6px;margin-right:4px;"></span>LIVE', live: true };
    if(diff > 0 && diff <= 3600) return { text: `T-${Math.round(diff/60)} MIN`, live: false };
    if(diff <= -3600) return { text: 'OFF AIR', live: false };
    return diff < 86400 ? { text: `T-${Math.round(diff/3600)} HRS`, live: false } : { text: `T-${Math.round(diff/86400)} DAYS`, live: false };
  }

  function createCard(item, delayIndex) {
    const m = item.media;
    const titleEn = m.title.english || m.title.romaji;
    const key = `${titleEn}-EP${item.episode}`;
    itemIndex[key] = item;

    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.airingAt = item.airingAt;
    card.style.animationDelay = `${Math.min(delayIndex * 40, 500)}ms`;

    const timeStr = new Date(item.airingAt * 1000).toLocaleTimeString('th-TH', { hour:'2-digit', minute:'2-digit' });
    const cd = countdownLabel(item.airingAt);

    card.innerHTML = `
      <div class="time-col mono">
        <span class="t">${timeStr}</span>
        <span class="countdown ${cd.live ? 'live' : ''}">${cd.text}</span>
      </div>
      <img class="poster" src="${m.coverImage.large}" loading="lazy">
      <div class="body">
        <div class="title-en">${titleEn}</div>
        <div class="meta mono">
          <span class="ep">EP ${item.episode}</span>
          <span style="font-size:11px;color:var(--muted)">${m.format || 'TV'}</span>
        </div>
      </div>
    `;
    card.onclick = () => openPreview(key);
    return card;
  }

  function renderList(list){
    const container = document.getElementById('schedule-container');
    container.innerHTML = '';
    
    if(!list || list.length === 0){
      document.getElementById('statusText').innerHTML = `<span style="color:var(--signal)">NO DATA FOUND</span>`;
      return;
    }

    const seen = new Set();
    const uniqueList = list.filter(item => {
      const title = item.media.title.english || item.media.title.romaji;
      const key = `${title}-EP${item.episode}`;
      if(seen.has(key)) return false; seen.add(key); return true;
    });

    uniqueList.forEach((item, i) => container.appendChild(createCard(item, i)));
    document.getElementById('statusText').innerHTML = `DETECTED: <b>${uniqueList.length}</b> SIGNALS`;
  }

  // ==== Mode & Tab Controllers ====
  function renderDayNav() {
    const dayNav = document.getElementById('dayNav');
    dayNav.innerHTML = '';
    const dayNames = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
    const today = new Date();

    for(let i = 0; i < 7; i++) {
      const d = new Date(today);
      d.setDate(today.getDate() + i);

      const btn = document.createElement('div');
      btn.className = `day-btn ${i === selectedOffset ? 'active' : ''}`;
      btn.innerHTML = `<span>${dayNames[d.getDay()]}</span><span class="d-num">${d.getDate()}</span>`;
      btn.onclick = () => { selectedOffset = i; renderCurrentView(); };
      dayNav.appendChild(btn);
    }
  }

  function renderCurrentView() {
    const dayNav = document.getElementById('dayNav');
    const heroContainer = document.getElementById('heroContainer');

    if(currentMode === 'today') {
      dayNav.style.display = 'none';
      if(cache.today) buildHeroSlider(cache.today);
      renderList(cache.today);
    } else {
      dayNav.style.display = 'flex';
      heroContainer.style.display = 'none'; // ซ่อน Hero ตอนเลือกโหมดสัปดาห์
      renderDayNav();

      if(cache.week) {
        const targetDay = new Date();
        targetDay.setDate(targetDay.getDate() + selectedOffset);
        // FIX: แก้บั๊กข้ามวันโดยใช้ toLocaleDateString เพื่อเปรียบเทียบใน Timezone เดียวกัน
        const targetStr = targetDay.toLocaleDateString('en-CA'); 

        const filtered = cache.week.filter(item => {
          const itemDayStr = new Date(item.airingAt * 1000).toLocaleDateString('en-CA');
          return itemDayStr === targetStr;
        });
        renderList(filtered);
      }
    }
  }

  async function load(mode, force=false){
    const container = document.getElementById('schedule-container');
    const btn = document.getElementById('refreshBtn');
    
    if(!cache[mode] || force){
      container.innerHTML = document.getElementById('skeletonWrap').outerHTML;
      btn.innerHTML = 'SYNCING...';
      try {
        cache[mode] = await fetchSchedule(mode);
      } catch(err) {
        btn.innerHTML = 'RETRY CONNECTION';
        return;
      }
    }
    renderCurrentView();
    btn.innerHTML = 'REBOOT SCAN ⟳';
  }

  // ==== Event Listeners ====
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      currentMode = tab.dataset.mode;
      // รีเซ็ตวันกลับมาเป็น 'วันนี้' เสมอเมื่อกดเข้าโหมด 7 วัน
      if (currentMode === 'week') selectedOffset = 0; 
      load(currentMode);
    });
  });

  document.getElementById('refreshBtn').addEventListener('click', () => load(currentMode, true));

  // ==== Clock & Timer ====
  function updateClock(){
    document.getElementById('clock').innerHTML = new Date().toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'});
  }
  setInterval(updateClock, 10000); updateClock();
  
  setInterval(() => {
    document.querySelectorAll('.card').forEach(card => {
      const cd = countdownLabel(card.dataset.airingAt);
      const el = card.querySelector('.countdown');
      if(el){ el.innerHTML = cd.text; el.className = `countdown mono ${cd.live?'live':''}`; }
    });
  }, 30000);

  // ==== Preview Panel ====
  const overlay = document.getElementById('previewOverlay');
  function openPreview(key){
    const item = itemIndex[key];
    const m = item.media;
    
    document.getElementById('previewBanner').style.backgroundImage = `url('${m.bannerImage || m.coverImage.large}')`;
    document.getElementById('previewPoster').src = m.coverImage.large;
    document.getElementById('previewTitleEn').textContent = m.title.english || m.title.romaji;
    document.getElementById('previewTitleNative').textContent = m.title.native || '';
    
    let chipsHTML = `<span class="chip mono" style="color:var(--gold);border-color:var(--gold)">★ ${m.averageScore||'N/A'}%</span>`;
    chipsHTML += `<span class="chip mono">EP ${item.episode}</span>`;
    (m.genres || []).slice(0,3).forEach(g => chipsHTML += `<span class="chip mono">${g}</span>`);
    document.getElementById('previewChips').innerHTML = chipsHTML;
    
    document.getElementById('previewDesc').textContent = m.description ? m.description.replace(/<[^>]+>/g, '') : 'No classified data available.';
    document.getElementById('previewLink').href = m.siteUrl;
    
    overlay.classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  
  document.getElementById('previewClose').onclick = () => { overlay.classList.remove('open'); document.body.style.overflow=''; };
  document.getElementById('previewBackdrop').onclick = document.getElementById('previewClose').onclick;

  // Boot
  load('today');
</script>

</body>
</html>
